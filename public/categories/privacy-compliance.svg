<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Privacy and compliance">
  <defs>
    <linearGradient id="pc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1410"/><stop offset="0.55" stop-color="#0a1a12"/><stop offset="1" stop-color="#060b08"/>
    </linearGradient>
    <linearGradient id="pc-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6f23c"/><stop offset="1" stop-color="#34c7a0"/>
    </linearGradient>
    <radialGradient id="pc-glow" cx="0.42" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#34c7a0" stop-opacity="0.20"/><stop offset="1" stop-color="#34c7a0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#pc-bg)"/>
  <rect width="800" height="500" fill="url(#pc-glow)"/>
  <g stroke="#a6f23c" stroke-opacity="0.07">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800"/>
    <path d="M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500"/>
  </g>
  <!-- shield -->
  <g transform="translate(150,80)">
    <path d="M170 0 L330 58 V196 C330 288 258 330 170 348 C82 330 10 288 10 196 V58 Z" fill="#0b120d" stroke="url(#pc-accent)" stroke-width="7"/>
    <path d="M170 26 L306 76 V196 C306 270 246 306 170 322 C94 306 34 270 34 196 V76 Z" fill="#a6f23c" fill-opacity="0.05"/>
    <!-- lock -->
    <g transform="translate(118,120)">
      <path d="M18 46V32a34 34 0 0 1 68 0v14" fill="none" stroke="url(#pc-accent)" stroke-width="10" stroke-linecap="round"/>
      <rect x="0" y="46" width="104" height="82" rx="14" fill="#060b08" stroke="url(#pc-accent)" stroke-width="7"/>
      <circle cx="52" cy="82" r="10" fill="#a6f23c"/>
      <path d="M52 92v18" stroke="#a6f23c" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
  <!-- consent document -->
  <g transform="translate(520,120)">
    <rect x="0" y="0" width="190" height="250" rx="14" fill="#0b120d" stroke="#a6f23c" stroke-opacity="0.28" stroke-width="3"/>
    <g fill="#ffffff" fill-opacity="0.12">
      <rect x="26" y="34" width="110" height="10" rx="5"/>
      <rect x="26" y="60" width="138" height="8" rx="4"/>
      <rect x="26" y="80" width="120" height="8" rx="4"/>
    </g>
    <g>
      <rect x="26" y="118" width="62" height="30" rx="15" fill="#a6f23c" fill-opacity="0.85"/>
      <circle cx="73" cy="133" r="11" fill="#060b08"/>
      <rect x="102" y="120" width="62" height="26" rx="13" fill="#ffffff" fill-opacity="0.10"/>
      <circle cx="115" cy="133" r="9" fill="#ffffff" fill-opacity="0.35"/>
    </g>
    <path d="M30 196 L58 224 L120 162" fill="none" stroke="url(#pc-accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect width="800" height="500" fill="#060b08" opacity="0.28"/>
  <rect width="800" height="500" fill="#34c7a0" opacity="0.06"/>
</svg>
