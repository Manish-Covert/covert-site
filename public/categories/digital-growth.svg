<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Digital growth">
  <defs>
    <linearGradient id="dg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1410"/><stop offset="0.55" stop-color="#0a1a12"/><stop offset="1" stop-color="#060b08"/>
    </linearGradient>
    <linearGradient id="dg-accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34c7a0"/><stop offset="1" stop-color="#a6f23c"/>
    </linearGradient>
    <linearGradient id="dg-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6f23c" stop-opacity="0.28"/><stop offset="1" stop-color="#a6f23c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dg-glow" cx="0.68" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#a6f23c" stop-opacity="0.20"/><stop offset="1" stop-color="#a6f23c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#dg-bg)"/>
  <rect width="800" height="500" fill="url(#dg-glow)"/>
  <g stroke="#a6f23c" stroke-opacity="0.07">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800"/>
    <path d="M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500"/>
  </g>
  <!-- browser frame -->
  <g transform="translate(96,96)">
    <rect x="0" y="0" width="470" height="300" rx="16" fill="#0b120d" stroke="#a6f23c" stroke-opacity="0.22"/>
    <path d="M0 44h470" stroke="#a6f23c" stroke-opacity="0.18"/>
    <circle cx="26" cy="22" r="5" fill="#a6f23c" fill-opacity="0.55"/>
    <circle cx="46" cy="22" r="5" fill="#34c7a0" fill-opacity="0.45"/>
    <circle cx="66" cy="22" r="5" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="92" y="14" width="200" height="16" rx="8" fill="#ffffff" fill-opacity="0.08"/>
    <!-- growth curve -->
    <path d="M36 250 L120 214 L196 232 L272 160 L348 176 L434 92" fill="none" stroke="url(#dg-accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 250 L120 214 L196 232 L272 160 L348 176 L434 92 L434 268 L36 268 Z" fill="url(#dg-fill)"/>
    <g fill="#a6f23c">
      <circle cx="120" cy="214" r="6"/><circle cx="272" cy="160" r="6"/><circle cx="434" cy="92" r="8"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.10">
      <rect x="36" y="282" width="90" height="8" rx="4"/><rect x="140" y="282" width="60" height="8" rx="4"/>
    </g>
  </g>
  <!-- magnifier -->
  <g transform="translate(560,180)">
    <circle cx="90" cy="90" r="86" fill="#060b08" fill-opacity="0.65" stroke="url(#dg-accent)" stroke-width="7"/>
    <path d="M152 152 L214 214" stroke="url(#dg-accent)" stroke-width="16" stroke-linecap="round"/>
    <g stroke="#a6f23c" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round">
      <path d="M56 108V78"/><path d="M86 108V56"/><path d="M116 108V92"/>
    </g>
    <path d="M46 128h96" stroke="#a6f23c" stroke-opacity="0.35" stroke-width="4"/>
  </g>
  <rect width="800" height="500" fill="#060b08" opacity="0.28"/>
  <rect width="800" height="500" fill="#34c7a0" opacity="0.06"/>
</svg>
