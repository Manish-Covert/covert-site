<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Authority and influence">
  <defs>
    <linearGradient id="ai-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1410"/><stop offset="0.55" stop-color="#0a1a12"/><stop offset="1" stop-color="#060b08"/>
    </linearGradient>
    <linearGradient id="ai-accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34c7a0"/><stop offset="1" stop-color="#a6f23c"/>
    </linearGradient>
    <radialGradient id="ai-glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#a6f23c" stop-opacity="0.18"/><stop offset="1" stop-color="#a6f23c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ai-bg)"/>
  <rect width="800" height="500" fill="url(#ai-glow)"/>
  <g stroke="#a6f23c" stroke-opacity="0.07">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800"/>
    <path d="M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500"/>
  </g>
  <!-- broadcast arcs (Covert C motif) -->
  <g transform="translate(400,250)" fill="none" stroke="#a6f23c" stroke-linecap="round">
    <path d="M-150 -86 A172 172 0 1 0 -150 86" stroke-opacity="0.30" stroke-width="6"/>
    <path d="M-196 -112 A226 226 0 1 0 -196 112" stroke-opacity="0.18" stroke-width="5" stroke-dasharray="26 20"/>
    <path d="M-244 -140 A282 282 0 1 0 -244 140" stroke-opacity="0.10" stroke-width="4"/>
  </g>
  <!-- microphone -->
  <g transform="translate(400,250)">
    <rect x="-34" y="-138" width="68" height="152" rx="34" fill="#0b120d" stroke="url(#ai-accent)" stroke-width="7"/>
    <g stroke="#a6f23c" stroke-opacity="0.35" stroke-width="4">
      <path d="M-34 -104h68"/><path d="M-34 -74h68"/><path d="M-34 -44h68"/><path d="M-34 -14h68"/>
    </g>
    <path d="M-64 -14a64 64 0 0 0 128 0" fill="none" stroke="url(#ai-accent)" stroke-width="9" stroke-linecap="round"/>
    <path d="M0 50v42" stroke="url(#ai-accent)" stroke-width="9" stroke-linecap="round"/>
    <path d="M-44 96h88" stroke="url(#ai-accent)" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- waveform -->
  <g stroke="#a6f23c" stroke-linecap="round" stroke-width="7">
    <path d="M120 250v-40" stroke-opacity="0.30"/><path d="M152 250v-76" stroke-opacity="0.45"/>
    <path d="M184 250v-28" stroke-opacity="0.25"/><path d="M216 250v-58" stroke-opacity="0.35"/>
    <path d="M584 250v-58" stroke-opacity="0.35"/><path d="M616 250v-28" stroke-opacity="0.25"/>
    <path d="M648 250v-76" stroke-opacity="0.45"/><path d="M680 250v-40" stroke-opacity="0.30"/>
  </g>
  <!-- star / recognition -->
  <g transform="translate(640,110)" fill="url(#ai-accent)" fill-opacity="0.9">
    <path d="M0 -30 L9 -9 L32 -6 L15 9 L20 32 L0 20 L-20 32 L-15 9 L-32 -6 L-9 -9 Z"/>
  </g>
  <rect width="800" height="500" fill="#060b08" opacity="0.28"/>
  <rect width="800" height="500" fill="#34c7a0" opacity="0.06"/>
</svg>
